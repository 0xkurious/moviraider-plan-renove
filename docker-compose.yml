services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:18.0
    depends_on: [db]
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./addons:/mnt/extra-addons
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo-data:/var/lib/odoo

  # Adaptador Odoo -> proveedor de mensajería. Por defecto simula (PROVIDER=mock);
  # con un .env real habla con respond.io. Ver docs/respondio-setup.md.
  bridge:
    image: python:3.12-alpine
    command: python /app/server.py
    working_dir: /app
    env_file:
      - path: .env
        required: false
    environment:
      FAIL_FIRST_N: "${FAIL_FIRST_N:-0}"
    ports:
      - "8001:8000"
    volumes:
      - ./bridge:/app:ro
      - bridge-data:/data

volumes:
  bridge-data:
  db-data:
  odoo-data:
